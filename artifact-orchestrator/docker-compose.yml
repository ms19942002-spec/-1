# 사내 서버 한 대에서 오케스트레이터 + 설치형 LLM(Ollama)을 함께 띄우는 구성.
# 코드와 산출물은 이 서버 밖으로 나가지 않는다.
services:
  orchestrator:
    build: .
    ports:
      - "8000:8000"
    environment:
      AO_LLM_BASE_URL: http://ollama:11434/v1
      AO_LLM_MODEL: ${AO_LLM_MODEL:-qwen2.5-coder:14b}
      AO_ALLOWED_ROOTS: /share
    volumes:
      - ./data:/data
      # 평가할 사내 공유폴더를 읽기 전용으로 연결 (경로는 환경에 맞게 수정)
      - ${SHARE_DIR:-./share}:/share:ro
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./ollama:/root/.ollama
    # GPU 서버라면 아래 주석 해제 (NVIDIA Container Toolkit 필요)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped
