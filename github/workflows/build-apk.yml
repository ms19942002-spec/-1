name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold Android project
        run: flutter create . --platforms=android --project-name dongtan_cheonan_alarm

      - name: Patch AndroidManifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's|(<manifest[^>]*>)|$1\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>|' $M
          perl -0pi -e 's|(<activity\s)|$1android:showWhenLocked="true" android:turnScreenOn="true" |' $M
          cat $M

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dongtan-cheonan-alarm-apk
          path: build/app/outputs/flutter-apk/app-release.apk
